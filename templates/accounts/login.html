<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Paclassy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full bg-gradient-to-br from-indigo-900 via-purple-900 to-indigo-800 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo/Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 backdrop-blur rounded-2xl mb-4">
        <span class="text-4xl">🎓</span>
      </div>
      <h1 class="text-3xl font-bold text-white">Paclassy</h1>
      <p class="text-indigo-200 mt-1">AI-Powered Teacher Assistant</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/20 shadow-2xl">
      <h2 class="text-xl font-semibold text-white mb-6">Welcome back 👋</h2>

      <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/20 border border-red-400/30 rounded-xl text-red-200 text-sm"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-indigo-100 mb-1.5">Username</label>
          <input type="text" id="username" required
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent text-sm"
            placeholder="Enter your username">
        </div>
        <div>
          <label class="block text-sm font-medium text-indigo-100 mb-1.5">Password</label>
          <input type="password" id="password" required
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent text-sm"
            placeholder="Enter your password">
        </div>

        <button type="submit" id="login-btn"
          class="w-full py-3 bg-indigo-500 hover:bg-indigo-400 text-white font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 mt-2">
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" class="hidden">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          </span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-indigo-200 text-sm">
          Don't have an account?
          <a href="/register/" class="text-white font-semibold hover:text-indigo-200 transition-colors">Create one →</a>
        </p>
      </div>
    </div>

    <!-- Features preview -->
    <div class="mt-8 grid grid-cols-3 gap-3 text-center">
      <div class="bg-white/5 rounded-xl p-3">
        <div class="text-2xl mb-1">🤖</div>
        <div class="text-xs text-indigo-200">AI Lesson Plans</div>
      </div>
      <div class="bg-white/5 rounded-xl p-3">
        <div class="text-2xl mb-1">📊</div>
        <div class="text-xs text-indigo-200">Smart Analytics</div>
      </div>
      <div class="bg-white/5 rounded-xl p-3">
        <div class="text-2xl mb-1">📝</div>
        <div class="text-xs text-indigo-200">Auto Grading</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');
      const errMsg = document.getElementById('error-msg');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'Signing in...';
      errMsg.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('access_token', data.access);
          localStorage.setItem('refresh_token', data.refresh);
          localStorage.setItem('user', JSON.stringify(data.user));

          const role = data.user.role;
          const redirectMap = {
            'teacher': '/dashboard/teacher/',
            'student': '/dashboard/student/',
            'admin': '/dashboard/admin/'
          };
          window.location.href = redirectMap[role] || '/dashboard/teacher/';
        } else {
          const msg = data.non_field_errors?.[0] || data.detail || 'Login failed. Please check your credentials.';
          errMsg.textContent = msg;
          errMsg.classList.remove('hidden');
        }
      } catch (err) {
        errMsg.textContent = 'Network error. Please try again.';
        errMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
