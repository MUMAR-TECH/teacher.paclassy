<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Paclassy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-full bg-gradient-to-br from-indigo-900 via-purple-900 to-indigo-800 flex items-center justify-center p-4 py-10">
  <div class="w-full max-w-lg">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 backdrop-blur rounded-2xl mb-4">
        <span class="text-4xl">🎓</span>
      </div>
      <h1 class="text-3xl font-bold text-white">Join Paclassy</h1>
      <p class="text-indigo-200 mt-1">Create your free account today</p>
    </div>

    <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/20 shadow-2xl">
      <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/20 border border-red-400/30 rounded-xl text-red-200 text-sm"></div>
      <div id="success-msg" class="hidden mb-4 p-3 bg-green-500/20 border border-green-400/30 rounded-xl text-green-200 text-sm"></div>

      <!-- Role selector -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-indigo-100 mb-3">I am a...</label>
        <div class="grid grid-cols-3 gap-3" id="role-selector">
          <button type="button" onclick="selectRole('teacher')" class="role-btn active-role p-3 rounded-xl border-2 border-indigo-400 bg-indigo-500/20 text-center transition-all">
            <div class="text-2xl mb-1">👨‍🏫</div>
            <div class="text-xs font-medium text-white">Teacher</div>
          </button>
          <button type="button" onclick="selectRole('student')" class="role-btn p-3 rounded-xl border-2 border-white/20 bg-white/5 text-center transition-all hover:border-white/40">
            <div class="text-2xl mb-1">👨‍🎓</div>
            <div class="text-xs font-medium text-white">Student</div>
          </button>
          <button type="button" onclick="selectRole('admin')" class="role-btn p-3 rounded-xl border-2 border-white/20 bg-white/5 text-center transition-all hover:border-white/40">
            <div class="text-2xl mb-1">🏫</div>
            <div class="text-xs font-medium text-white">Admin</div>
          </button>
        </div>
        <input type="hidden" id="selected-role" value="teacher">
      </div>

      <form id="register-form" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-indigo-100 mb-1.5">First Name</label>
            <input type="text" id="first_name" class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" placeholder="First name">
          </div>
          <div>
            <label class="block text-xs font-medium text-indigo-100 mb-1.5">Last Name</label>
            <input type="text" id="last_name" class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" placeholder="Last name">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-indigo-100 mb-1.5">Username</label>
          <input type="text" id="username" required class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" placeholder="Choose a username">
        </div>
        <div>
          <label class="block text-xs font-medium text-indigo-100 mb-1.5">Email</label>
          <input type="email" id="email" required class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" placeholder="your@email.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-indigo-100 mb-1.5">Password</label>
          <input type="password" id="password" required minlength="8" class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" placeholder="Minimum 8 characters">
        </div>
        <div>
          <label class="block text-xs font-medium text-indigo-100 mb-1.5">Confirm Password</label>
          <input type="password" id="password2" required minlength="8" class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" placeholder="Repeat password">
        </div>

        <button type="submit" id="register-btn"
          class="w-full py-3 bg-indigo-500 hover:bg-indigo-400 text-white font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 mt-2">
          <span id="btn-text">Create Account</span>
          <span id="btn-spinner" class="hidden">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          </span>
        </button>
      </form>

      <div class="mt-5 text-center">
        <p class="text-indigo-200 text-sm">Already have an account? <a href="/login/" class="text-white font-semibold hover:text-indigo-200">Sign in →</a></p>
      </div>
    </div>
  </div>

  <script>
    function selectRole(role) {
      document.getElementById('selected-role').value = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.remove('border-indigo-400', 'bg-indigo-500/20');
        btn.classList.add('border-white/20', 'bg-white/5');
      });
      event.currentTarget.classList.add('border-indigo-400', 'bg-indigo-500/20');
      event.currentTarget.classList.remove('border-white/20', 'bg-white/5');
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');
      const errMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'Creating account...';
      errMsg.classList.add('hidden');
      successMsg.classList.add('hidden');

      const payload = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        password2: document.getElementById('password2').value,
        role: document.getElementById('selected-role').value,
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
      };

      try {
        const res = await fetch('/api/v1/auth/register/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('access_token', data.access);
          localStorage.setItem('refresh_token', data.refresh);
          localStorage.setItem('user', JSON.stringify(data.user));
          successMsg.textContent = '✅ Account created! Redirecting...';
          successMsg.classList.remove('hidden');
          const role = data.user.role;
          setTimeout(() => {
            const redirectMap = { 'teacher': '/dashboard/teacher/', 'student': '/dashboard/student/', 'admin': '/dashboard/admin/' };
            window.location.href = redirectMap[role] || '/dashboard/teacher/';
          }, 1000);
        } else {
          const msgs = [];
          for (const [field, errors] of Object.entries(data)) {
            msgs.push(Array.isArray(errors) ? errors.join(' ') : errors);
          }
          errMsg.textContent = msgs.join(' ') || 'Registration failed.';
          errMsg.classList.remove('hidden');
        }
      } catch (err) {
        errMsg.textContent = 'Network error. Please try again.';
        errMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
        btnText.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
