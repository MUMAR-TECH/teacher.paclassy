<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true', sidebarOpen: true }" :class="darkMode ? 'dark' : ''" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Paclassy{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81', 950: '#1e1b4b' },
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgb(0 0 0 / 0.04), 0 4px 12px 0 rgb(0 0 0 / 0.06)',
            'card-hover': '0 4px 16px 0 rgb(0 0 0 / 0.1)',
          }
        }
      }
    }
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Sidebar */
    .sidebar-link {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 10px;
      font-size: 0.875rem; font-weight: 500;
      transition: all 0.18s ease; position: relative;
      color: rgba(199,210,254,0.85);
    }
    .sidebar-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar-link.active {
      background: rgba(255,255,255,0.15);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    .sidebar-link.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px; border-radius: 0 3px 3px 0;
      background: white;
    }

    /* Cards */
    .card {
      background: white; border-radius: 16px;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.04), 0 4px 12px rgb(0 0 0 / 0.06);
      border: 1px solid rgb(243 244 246);
      padding: 1.5rem;
    }
    .dark .card {
      background: #1f2937; border-color: #374151;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.2), 0 4px 12px rgb(0 0 0 / 0.15);
    }
    .card-hover { transition: box-shadow 0.2s, transform 0.2s; }
    .card-hover:hover {
      box-shadow: 0 4px 20px rgb(0 0 0 / 0.1);
      transform: translateY(-1px);
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white; border-radius: 10px; font-weight: 600;
      font-size: 0.875rem; transition: all 0.18s;
      box-shadow: 0 1px 4px rgb(99 102 241 / 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      box-shadow: 0 3px 10px rgb(99 102 241 / 0.45);
      transform: translateY(-1px);
    }
    .btn-primary:disabled { opacity: 0.65; transform: none; cursor: not-allowed; }

    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: #f3f4f6; color: #374151;
      border-radius: 10px; font-weight: 500; font-size: 0.875rem;
      transition: all 0.18s; border: 1px solid #e5e7eb;
    }
    .btn-secondary:hover { background: #e5e7eb; }
    .dark .btn-secondary { background: #374151; color: #e5e7eb; border-color: #4b5563; }
    .dark .btn-secondary:hover { background: #4b5563; }

    /* Input fields */
    .input-field {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 0.875rem; background: white; color: #111827;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .input-field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgb(99 102 241 / 0.12);
    }
    .dark .input-field {
      background: #374151; border-color: #4b5563;
      color: white;
    }
    .dark .input-field:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgb(129 140 248 / 0.15); }
    .input-field::placeholder { color: #9ca3af; }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.01em;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

    /* Stat card icon */
    .stat-icon {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white" x-effect="localStorage.setItem('darkMode', darkMode)">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-[68px]'" class="{% block sidebar_color %}bg-gradient-to-b from-indigo-900 to-indigo-950{% endblock %} transition-all duration-300 ease-in-out flex flex-col h-full flex-shrink-0 shadow-xl">
      <!-- Logo -->
      <div class="flex items-center gap-3 px-4 h-[64px] border-b border-white/10 flex-shrink-0">
        <div class="w-9 h-9 bg-gradient-to-br from-indigo-400 to-violet-500 rounded-xl flex items-center justify-center flex-shrink-0 shadow-md">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"/>
          </svg>
        </div>
        <div x-show="sidebarOpen" x-transition:enter="transition-opacity duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
          <span class="text-white font-bold text-base tracking-tight">Paclassy</span>
          <span class="block text-indigo-300 text-[10px] font-medium tracking-widest uppercase">AI Platform</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
        {% block sidebar_nav %}{% endblock %}
      </nav>

      <!-- Collapse toggle -->
      <div class="px-3 pb-3">
        <button @click="sidebarOpen = !sidebarOpen"
          class="w-full flex items-center justify-center gap-2 py-2 rounded-xl text-white/50 hover:text-white hover:bg-white/10 transition-all text-xs font-medium">
          <svg :class="sidebarOpen ? '' : 'rotate-180'" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
          </svg>
          <span x-show="sidebarOpen" class="text-xs">Collapse</span>
        </button>
      </div>

      <!-- User Info -->
      <div class="border-t border-white/10 p-3 flex-shrink-0">
        <div class="flex items-center gap-3 px-2 py-2.5 rounded-xl hover:bg-white/10 transition-colors cursor-pointer">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-400 to-indigo-500 flex items-center justify-center flex-shrink-0 shadow-sm">
            <span class="text-white text-sm font-bold" id="user-avatar-initial">?</span>
          </div>
          <div x-show="sidebarOpen" class="min-w-0 flex-1">
            <p class="text-white text-xs font-semibold truncate" id="sidebar-username">Loading...</p>
            <p class="text-indigo-300 text-[11px] truncate" id="sidebar-role">...</p>
          </div>
          <div x-show="sidebarOpen" class="flex-shrink-0">
            <svg class="w-4 h-4 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"/>
            </svg>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <!-- Top Header -->
      <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 px-6 h-[64px] flex items-center justify-between flex-shrink-0 shadow-sm">
        <div class="flex items-center gap-3">
          <h1 class="font-bold text-gray-800 dark:text-white text-lg">{% block page_title %}Dashboard{% endblock %}</h1>
        </div>
        <div class="flex items-center gap-2">
          <!-- Dark mode toggle -->
          <button @click="darkMode = !darkMode"
            class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-500 dark:text-gray-400">
            <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
            </svg>
            <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
            </svg>
          </button>

          <!-- Notifications -->
          <button class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-500 dark:text-gray-400 relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
            </svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full ring-2 ring-white dark:ring-gray-900"></span>
          </button>

          <!-- Profile dropdown -->
          <div x-data="{ open: false }" class="relative">
            <button @click="open = !open"
              class="flex items-center gap-2.5 pl-3 pr-3 py-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
              <div class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-sm">
                <span class="text-white text-xs font-bold" id="header-avatar-initial">?</span>
              </div>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-200" id="header-username">User</span>
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
              </svg>
            </button>
            <div x-show="open" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
              @click.away="open = false"
              class="absolute right-0 mt-2 w-52 bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 py-2 z-50">
              <div class="px-4 py-2 border-b border-gray-100 dark:border-gray-700 mb-1">
                <p class="text-xs text-gray-500 dark:text-gray-400">Signed in as</p>
                <p class="text-sm font-semibold text-gray-800 dark:text-white truncate" id="dropdown-username">User</p>
              </div>
              <a href="#" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Profile
              </a>
              <hr class="my-1 border-gray-100 dark:border-gray-700">
              <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
                Sign Out
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-gray-950">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  {% block extra_scripts %}{% endblock %}
  <script>
    // Also update dropdown username
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('dropdown-username');
      const user = (() => { try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch { return null; } })();
      if (el && user) el.textContent = user.full_name || user.email || 'User';
    });
  </script>
</body>
</html>
